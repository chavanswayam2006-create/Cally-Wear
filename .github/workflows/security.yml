name: Enterprise Security & QA Suite

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  security-audit:
    name: Security & QA Release Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: 1. Software Composition Analysis (SCA / npm audit)
        run: npm audit --audit-level=high

      - name: 2. Static Analysis & Linting (SAST)
        run: npm run lint

      - name: 3. Secret Scanning (Audit NEXT_PUBLIC and Client Bundles)
        run: |
          echo "Scanning for exposed server secrets in client bundle..."
          ! grep -rn "PAYMENT_WEBHOOK_SECRET" app/ components/ lib/store/ || exit 1
          ! grep -rn "SECURITY_HMAC_SECRET" app/ components/ lib/store/ || exit 1

      - name: 4. Automated Security Regression Suite
        run: npm run test:security
